<h2 class="text-center mb-4 text-dark">Registro de Pacientes</h2>
      <p class="lead text-center text-dark">
        Complete el siguiente formulario para registrarse en la clínica y poder agendar sus citas.
      </p>
      <!-- Formulario Pacientes -->
      <form (ngSubmit)="registrarPaciente()" #formPaciente="ngForm">
        <!-- Tipo de Identificación -->
        <div class="mb-3">
          <label for="tipoIdentificacion" class="form-label text-dark">Tipo de Identificación:</label>
          <select id="tipoIdentificacion" name="tipoIdentificacion" [(ngModel)]="paciente.tipoIdentificacion"
            class="form-select text-dark" required>
            <option value="" disabled selected>Seleccione un tipo de identificación</option>
            <option value="cc">Cédula de Ciudadanía</option>
            <option value="ti">Tarjeta de Identidad</option>
            <option value="ce">Cédula de Extranjería</option>
            <option value="pas">Pasaporte</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="nombresPaciente" class="form-label text-dark">Nombres:</label>
          <input type="text" id="nombresPaciente" name="nombresPaciente" [(ngModel)]="paciente.nombres"
            class="form-control text-dark" required>
        </div>

        <div class="mb-3">
          <label for="apellidosPaciente" class="form-label text-dark">Apellidos:</label>
          <input type="text" id="apellidosPaciente" name="apellidosPaciente" [(ngModel)]="paciente.apellidos"
            class="form-control text-dark" required>
        </div>

        <div class="mb-3">
          <label for="numeroIdentificacion" class="form-label text-dark">Número de Identificación:</label>
          <input type="text" id="numeroIdentificacion" name="numeroIdentificacion" [(ngModel)]="paciente.tipoIdentificacion"
            class="form-control text-dark" required>
        </div>

        <div class="mb-3">
          <label for="correoElectronico" class="form-label text-dark">Correo Electrónico:</label>
          <input type="email" id="correoElectronico" name="correoElectronico" [(ngModel)]="paciente.correo"
            class="form-control text-dark" required>
        </div>

        <!-- Género -->
        <fieldset class="mb-3">
          <legend class="form-label text-dark">Género:</legend>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" id="femenino" name="genero" [(ngModel)]="paciente.genero"
              value="femenino">
            <label class="form-check-label text-dark" for="femenino">Femenino</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" id="masculino" name="genero" [(ngModel)]="paciente.genero"
              value="masculino">
            <label class="form-check-label text-dark" for="masculino">Masculino</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" id="otro" name="genero" [(ngModel)]="paciente.genero"
              value="otro">
            <label class="form-check-label text-dark" for="otro">Otro</label>
          </div>
        </fieldset>

        <div class="mb-3">
          <label for="fechaNacimiento" class="form-label text-dark">Fecha de Nacimiento:</label>
          <input type="date" id="fechaNacimiento" name="fechaNacimiento" [(ngModel)]="paciente.fechaNacimiento"
            class="form-control text-dark" required>
        </div>

        <button type="submit" class="btn btn-primary">Registrar Paciente</button>
      </form>

      <div *ngIf="mensaje" class="alert alert-info mt-3">{{ mensaje }}</div>
