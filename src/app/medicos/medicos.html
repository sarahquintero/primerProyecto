<h2 class="text-center mb-4 text-dark">Registro de Médicos</h2>

<form (ngSubmit)="registrarMedico()" #formMedico="ngForm" class="mb-5">
  <div class="mb-3">
    <label for="nombresMedico" class="form-label text-dark">Nombres:</label>
    <input type="text" id="nombresMedico" name="nombresMedico"
           [(ngModel)]="medico.nombre" class="form-control text-dark"
           placeholder="Nombres" required>
  </div>

  <div class="mb-3">
    <label for="apellidosMedico" class="form-label text-dark">Apellidos:</label>
    <input type="text" id="apellidosMedico" name="apellidosMedico"
           [(ngModel)]="medico.apellido" class="form-control text-dark"
           placeholder="Apellidos" required>
  </div>

  <div class="mb-3">
    <label for="especialidadMedico" class="form-label text-dark">Especialidad:</label>
    <input type="text" id="especialidadMedico" name="especialidadMedico"
           [(ngModel)]="medico.especialidad" class="form-control text-dark"
           placeholder="Especialidad" required>
  </div>

  <div class="mb-3">
    <label for="horarioMedico" class="form-label text-dark">Horario de atención:</label>
    <input type="text" id="horarioMedico" name="horarioMedico"
           [(ngModel)]="medico.horarioAtencion" class="form-control text-dark"
           placeholder="Ej: Lunes a Viernes 8am-4pm" required>
  </div>

  <div class="mb-3">
    <label for="experienciaMedico" class="form-label text-dark">Años de experiencia:</label>
    <input type="number" id="experienciaMedico" name="experienciaMedico"
           [(ngModel)]="medico.aniosExperiencia" class="form-control text-dark"
           min="0" placeholder="Años de experiencia" required>
  </div>

  <div class="mb-3">
    <label for="bibliografiaMedico" class="form-label text-dark">Bibliografía:</label>
    <textarea id="bibliografiaMedico" name="bibliografiaMedico"
              [(ngModel)]="medico.bibliografia" class="form-control text-dark"
              placeholder="Breve descripción del médico"></textarea>
  </div>

  <button type="submit" class="btn btn-primary">Registrar Médico</button>
</form>

<div *ngIf="mensajeMedico" class="alert alert-info mt-3">{{ mensajeMedico }}</div>
